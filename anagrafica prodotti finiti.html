<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Prodotti Finiti - Berry e Ciccio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; color: #333; }
        .form-container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #007bff; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; color: white; }
        .btn-save { background-color: #28a745; }
        .btn-back { background-color: #6c757d; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>✨ Anagrafica Prodotti Finiti</h2>
        <form>
            <div class="form-group">
                <label>Nome Prodotto:</label>
                <input type="text">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Codice Articolo / SKU:</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Unità di Misura:</label>
                    <select id="um_prod">
                        <option value="">-- Configura UM --</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Prezzo di Vendita (€):</label>
                    <input type="text" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Aliquota IVA:</label>
                    <select id="iva_prod">
                        <option value="">-- Configura IVA --</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Descrizione Tecnica:</label>
                <textarea rows="3"></textarea>
            </div>
            <div class="btn-container">
                <a href="index.html" class="btn btn-back">Indietro</a>
                <button type="button" class="btn btn-save" onclick="alert('Articolo salvato correttamente!')">Registra Prodotto</button>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Popola UM
            var umS = document.getElementById("um_prod");
            var umL = JSON.parse(localStorage.getItem("unita_misura") || "[]");
            if (umL.length > 0) {
                umS.innerHTML = '<option value="">-- Seleziona --</option>';
                umL.forEach(v => { var o = document.createElement("option"); o.textContent = v; umS.appendChild(o); });
            }
            // Popola IVA
            var ivaS = document.getElementById("iva_prod");
            var ivaL = JSON.parse(localStorage.getItem("aliquote_iva") || "[]");
            if (ivaL.length > 0) {
                ivaS.innerHTML = '<option value="">-- Seleziona --</option>';
                ivaL.forEach(v => { var o = document.createElement("option"); o.textContent = v; ivaS.appendChild(o); });
            }
        });
    </script>
</body>
</html>
