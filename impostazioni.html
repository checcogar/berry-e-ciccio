<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Impostazioni di Sistema - Berry e Ciccio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 30px; color: #333; margin: 0; }
        .main-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 30px; color: #007bff; }
        
        /* Struttura a Tab (Schede) stile Gestionale Professionale */
        .tab-container { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { padding: 12px 20px; border: none; background: none; font-size: 15px; font-weight: bold; cursor: pointer; color: #555; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: #007bff; background-color: #f8f9fa; }
        .tab-btn.active { color: #007bff; border-bottom-color: #007bff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Griglia interna per le opzioni */
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .config-box { background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 6px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .box-title { font-weight: bold; font-size: 15px; color: #333; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        
        /* Form inserimento rapido */
        .input-group { display: flex; gap: 5px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input:focus { border-color: #007bff; outline: none; }
        
        .btn { padding: 8px 12px; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-add { background-color: #007bff; color: white; }
        .btn-add:hover { background-color: #0056b3; }
        .btn-back { background-color: #6c757d; color: white; display: inline-block; width: 120px; margin-top: 30px; padding: 12px; font-size: 16px; }
        .btn-back:hover { background-color: #5a6268; }
        
        /* Liste delle voci inserite */
        .item-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 4px; background: white; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .item-row:last-child { border-bottom: none; }
        .btn-del { background: none; border: none; color: #dc3545; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-del:hover { color: #bd2130; }
        .empty-text { color: #999; font-style: italic; text-align: center; padding: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>⚙️ Pannello Configurazione di Sistema</h2>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="openTab(event, 'tab-anagrafiche')">👥 Tabelle Anagrafiche</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-vendite')">📄 Vendite & Fisco</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-magazzino')">📦 Magazzino & Logistica</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-generali')">🏢 Dati Azienda & Banche</button>
        </div>

        <div id="tab-anagrafiche" class="tab-content active">
            <div class="config-grid">
                <div class="config-box">
                    <div class="box-title">🎖️ Classificazione Clienti (A, B, GOLD...)</div>
                    <div class="input-group">
                        <input type="text" id="in_classificazioni_clienti" placeholder="Nuovo livello...">
                        <button class="btn btn-add" onclick="saveItem('classificazioni_clienti')">+</button>
                    </div>
                    <ul id="list_classificazioni_clienti" class="item-list"></ul>
                </div>
                <div class="config-box">
                    <div class="box-title">🚚 Categorie Fornitori</div>
                    <div class="input-group">
                        <input type="text" id="in_categorie_fornitori" placeholder="Es. Subfornitore, Esterno...">
                        <button class="btn btn-add" onclick="saveItem('categorie_fornitori')">+</button>
                    </div>
                    <ul id="list_categorie_fornitori" class
