<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Impostazioni Sistema - Berry e Ciccio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; color: #333; }
        .config-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; color: #007bff; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        input:focus { border-color: #007bff; outline: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-add { background-color: #007bff; color: white; }
        .btn-add:hover { background-color: #0056b3; }
        .btn-back { background-color: #6c757d; color: white; display: block; width: 100px; margin-top: 25px; text-align: center; }
        .btn-back:hover { background-color: #5a6268; }
        .list-title { font-weight: bold; margin-bottom: 10px; color: #444; font-size: 16px; border-bottom: 2px solid #f4f4f9; padding-bottom: 5px; }
        .voice-list { list-style: none; padding: 0; margin: 0; }
        .voice-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; margin-bottom: 8px; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background-color: #bd2130; }
        .empty-msg { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <div class="config-container">
        <h2>⚙️ Impostazioni Classificazione Clienti</h2>
        <p>Inserisci qui sotto i livelli o le categorie per i tuoi clienti (es. Clienti A, Clienti B, GOLD). Verranno mostrate automaticamente nella scheda Anagrafica.</p>
        <div class="form-group">
            <input type="text" id="nuova_voce" placeholder="Es. Cliente GOLD" autocomplete="off">
            <button class="btn btn-add" onclick="aggiungiVoce()">Aggiungi</button>
        </div>
        <div class="list-title">Classificazioni Attuali:</div>
        <ul id="lista_voci" class="voice-list"></ul>
        <a href="index.html" class="btn btn-back">Indietro</a>
    </div>

    <script>
        const STORAGE_KEY = "classificazioni_clienti";
        document.addEventListener("DOMContentLoaded", mostraVoci);

        function mostraVoci() {
            const listaUl = document.getElementById("lista_voci");
            listaUl.innerHTML = "";
            let voci = ominiRecuperaVoci();
            if (voci.length === 0) {
                listaUl.innerHTML = '<li class="empty-msg">Nessuna classificazione configurata. Il menu in anagrafica sarà vuoto.</li>';
                return;
            }
            voci.forEach((voce, index) => {
                const li = document.createElement("li");
                li.className = "voice-item";
                li.innerHTML = `<span>${voce}</span><button class="btn-delete" onclick="eliminaVoce(${index})">Elimina</button>`;
                listaUl.appendChild(li);
            });
        }

        function aggiungiVoce() {
            const input = document.getElementById("nuova_voce");
            const testo = input.value.trim();
            if (testo === "") { alert("Per favore, inserisci un nome valido."); return; }
            let voci = ominiRecuperaVoci();
            if (voci.map(v => v.toLowerCase()).includes(testo.toLowerCase())) { alert("Questa classificazione esiste già!"); return; }
            voci.push(testo);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(voci));
            input.value = "";
            mostraVoci();
        }

        function eliminaVoce(index) {
            let voci = ominiRecuperaVoci();
            voci.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(voci));
            mostraVoci();
        }

        function ominiRecuperaVoci() {
            let dati = localStorage.getItem(STORAGE_KEY);
            return dati ? JSON.parse(dati) : [];
        }
    </script>
</body>
</html>
