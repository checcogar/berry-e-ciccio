<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica Fornitori - Berry e Ciccio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; color: #333; }
        .form-container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; color: #007bff; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        .form-group.small { flex: 0 0 120px; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #444; }
        input[type="text"], input[type="email"], select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .section-title { font-size: 16px; font-weight: bold; color: #007bff; margin-top: 25px; margin-bottom: 15px; border-bottom: 2px solid #f4f4f9; padding-bottom: 5px; }
        .btn-container { display: flex; gap: 10px; margin-top: 30px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-back { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🚚 Anagrafica Fornitori</h2>
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label for="cat_fornitore">Categoria Fornitore:</label>
                    <select id="cat_fornitore">
                        <option value="">-- Nessuna voce configurata --</option>
                    </select>
                </div>
            </div>
            <div class="section-title">Dati Societari</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="ragione_sociale">Ragione Sociale:</label>
                    <input type="text" id="ragione_sociale">
                </div>
                <div class="form-group">
                    <label for="piva">Partita IVA / CF:</label>
                    <input type="text" id="piva">
                </div>
            </div>
            <div class="section-title">Sede Legale</div>
            <div class="form-row">
                <div class="form-group"><label>Indirizzo:</label><input type="text"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Città:</label><input type="text"></div>
                <div class="form-group small"><label>CAP:</label><input type="text" maxlength="5"></div>
                <div class="form-group small"><label>Prov.:</label><input type="text" maxlength="2"></div>
            </div>
            <div class="btn-container">
                <a href="index.html" class="btn btn-back">Menu</a>
                <button type="button" class="btn btn-save" onclick="alert('Dati pronti per il salvataggio!')">Salva Fornitore</button>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var select = document.getElementById("cat_fornitore");
            var salvate = localStorage.getItem("categorie_fornitori");
            if (salvate) {
                var lista = JSON.parse(salvate);
                if (lista.length > 0) {
                    select.innerHTML = '<option value="">-- Seleziona Categoria --</option>';
                    lista.forEach(function(v) {
                        var opt = document.createElement("option");
                        opt.textContent = v; select.appendChild(opt);
                    });
                }
            }
        });
    </script>
</body>
</html>
